      if (!pick.selected.some(s => s.path === pick.path)) {
        pick.selected.push({ sourceId: pick.sourceId, path: pick.path });
      }
      paint();
    };

    const confirmBtn = $('#pConfirm');
    if (confirmBtn) confirmBtn.onclick = () => {
      // 勾了东西就只确认勾选的；什么都没勾但已在某个文件夹里，就把这个文件夹纳入
      // （原来必须点「加入当前文件夹」才行，多一步，用户常以为确定按钮坏了）
      if (pick.selected.length) {
        onDone(pick.selected);
        closeModals2();
        return;
      }
      if (mode === 'folders' && pick.path) {
        onDone([{ sourceId: pick.sourceId, path: pick.path }]);
        closeModals2();
      }
    };
  }

  load();
}

function vsize(n) {
  if (!n) return '0 MB';
  return n < 1024 * 1024 ? Math.round(n / 1024) + ' KB'
    : (n / 1024 / 1024).toFixed(1) + ' MB';
}

async function loadVideos() {
  const box = $('#vbody');
  if (!box) return;
  try {
    const data = await api('wallpaper/videos');
    const clips = data.clips || [];
    if (!clips.length) {
      box.innerHTML = '<div class="hint" style="margin:0">还没有视频。点「上传视频」从手机相册挑，或用「从存储源选」从 NAS 里挑。</div>';
      return;
    }
    box.innerHTML = clips.map((c, i) => `<div class="track">
        <span class="tno">${i + 1}</span>
        <div class="tinfo"><div class="tname">${esc(c.title || c.name)}</div>
          <div class="tkind">${vsize(c.size)} · ${c.uploaded ? '手机上传' : '存储源'}</div></div>
        <button class="icobtn" data-up="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="icobtn" data-down="${i}" ${i === clips.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="icobtn" data-del="${esc(c.name)}">×</button>
      </div>`).join('')
      + `<div class="hint" style="margin:8px 2px 0">共 ${clips.length} 段 · ${vsize(data.total)}</div>`;

    const reorder = async (from, to) => {
      if (to < 0 || to >= clips.length) return;
      const names = clips.map(c => c.name);
      const moved = names.splice(from, 1)[0];
      names.splice(to, 0, moved);
      try {
        await api('wallpaper/videos/reorder', { method: 'POST', body: JSON.stringify({ names }) });
        loadVideos();
      } catch (e) { toast('排序失败：' + e.message); }
    };

    box.querySelectorAll('[data-up]').forEach(b => b.onclick = () => reorder(Number(b.dataset.up), Number(b.dataset.up) - 1));
    box.querySelectorAll('[data-down]').forEach(b => b.onclick = () => reorder(Number(b.dataset.down), Number(b.dataset.down) + 1));
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const name = b.dataset.del;
      if (!confirm('删掉这一段视频？本机副本也会一起删。')) return;
      try {
        const r = await api('wallpaper/videos/remove', { method: 'POST', body: JSON.stringify({ name }) });
        toast((r && r.message) || '已删除');
        loadVideos();
      } catch (e) { toast('删除失败：' + e.message); }
    });
  } catch (e) {
    box.innerHTML = `<div class="hint" style="margin:0">读取失败：${esc(e.message)}</div>`;
  }
}

/** 单文件上传：XHR 才有上传进度（fetch 没有） */
function uploadVideoOne(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', withPin('/api/wallpaper/upload?name=' + encodeURIComponent(file.name)));
    if (PIN) xhr.setRequestHeader('X-Pin', PIN);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => {
      let data = null;
      try { data = JSON.parse(xhr.responseText || 'null'); } catch (e) { data = null; }
      if (xhr.status >= 200 && xhr.status < 300) resolve(data);
      else reject(new Error((data && data.message) || ('HTTP ' + xhr.status)));
    };
    xhr.onerror = () => reject(new Error('网络中断'));
    xhr.send(file);
  });
}

async function uploadVideos(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  let ok = 0, fail = 0;
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    const label = `(${i + 1}/${list.length}) ${f.name}`;
    try {
      toast(`上传中 ${label} 0%`, 600000);
      await uploadVideoOne(f, p => toast(`上传中 ${label} ${Math.round(p * 100)}%`, 600000));
      ok++;
    } catch (e) {
      fail++;
      toast(`「${f.name}」失败：${e.message}`);
    }
  }
  state.appearance = Object.assign({}, state.appearance, { wallpaperKind: 'VIDEO' });
  toast(fail ? `完成：成功 ${ok} 段，失败 ${fail} 段` : `已上传 ${ok} 段视频，背景已切到视频`);
  renderAppearance();
}

function bindWpBody() {
  if ($('#vbody')) {
    loadVideos();
    const up = $('#upVideo');
    const file = $('#vfile');
    if (up && file) {
      up.onclick = () => file.click();
      file.onchange = e => { uploadVideos(e.target.files); e.target.value = ''; };
    }
    const src = $('#srcVideo');
    if (src) src.onclick = () => openPicker({
      mode: 'video', multiple: true,
      onDone: async refs => {
        if (!refs || !refs.length) return;
        toast('正在从存储源复制到电视，大文件需要一会儿…', 600000);
        let ok = 0, fail = 0;
        for (const r of refs) {
          try {
            await api('wallpaper/videos/add', {
              method: 'POST',
              body: JSON.stringify({ sourceId: r.sourceId, path: r.path })
            });
            ok++;
          } catch (e) { fail++; }
        }
        state.appearance = Object.assign({}, state.appearance, { wallpaperKind: 'VIDEO' });
        toast(fail ? `已添加 ${ok} 段，${fail} 段失败` : `已添加 ${ok} 段视频`);
        renderAppearance();
      }
    });
    const loop = $('#vloop');
    if (loop) loop.onchange = e => saveAppearance({ wallpaperVideoLoop: e.target.checked }, '已更新轮播设置');
    const dim = $('#vdimRange');
    if (dim) {
      // 拖动过程中只改本地预览，不发请求。
      // 以前是 oninput 里直接 saveAppearance：手指每挪 1% 就发一次 POST，
      // 服务端写盘 + 推 WebSocket + 前端整页重渲染，拖起来当然卡成幻灯片。
      dim.oninput = e => {
        const v = Number(e.target.value) / 100;
        const l = $('#vdimLabel');
        if (l) l.textContent = '压暗程度 ' + Math.round(v * 100) + '%';
      };
      // 松手才落盘
      dim.onchange = e =>
        saveAppearance({ wallpaperDim: Number(e.target.value) / 100 }, null);
    }
  }

  const grid = $('#wpgrid');
  if (grid) {
    grid.querySelectorAll('[data-preset]').forEach(b => b.onclick = () =>
      saveAppearance({ wallpaperKind: 'GRADIENT', wallpaperPreset: Number(b.dataset.preset) }, '壁纸已更新'));
  }

  const pickWp = $('#pickWp');
  if (pickWp) pickWp.onclick = () => openPicker({
    mode: 'image', multiple: false,
    onDone: refs => {
      if (!refs[0]) return;
      saveAppearance({
        wallpaperKind: 'IMAGE',
        wallpaperSourceId: refs[0].sourceId,
        wallpaperPath: refs[0].path
      }, '壁纸已换成这张照片');
    }
  });

  const clearWp = $('#clearWp');
  if (clearWp) clearWp.onclick = () => saveAppearance({
    clearWallpaperImage: true, wallpaperKind: 'GRADIENT'
  }, '已移除图片壁纸');

  const dimRange = $('#dimRange');
  if (dimRange) {
    dimRange.oninput = e => {
      $('#dimLabel').textContent = '压暗程度 ' + e.target.value + '%';
    };
    dimRange.onchange = e =>
      saveAppearance({ wallpaperDim: Number(e.target.value) / 100 }, '已调整压暗');
  }

  const blurOn = $('#blurOn');
  if (blurOn) blurOn.onchange = e =>
    saveAppearance({ wallpaperBlur: e.target.checked }, '已更新');
}

async function saveAppearance(patch, msg) {
  try {
    await api('appearance', { method: 'POST', body: JSON.stringify(patch) });
    // 本地先合并，界面立刻响应，不必等状态往返
    state.appearance = Object.assign({}, state.appearance, {
      themeMode: patch.themeMode || state.appearance.themeMode,
      accentColor: patch.accentColor || state.appearance.accentColor,
      wallpaperKind: patch.wallpaperKind || state.appearance.wallpaperKind,
      wallpaperPreset: patch.wallpaperPreset == null ? state.appearance.wallpaperPreset : patch.wallpaperPreset,
      wallpaperDim: patch.wallpaperDim == null ? state.appearance.wallpaperDim : patch.wallpaperDim,
      wallpaperBlur: patch.wallpaperBlur == null ? state.appearance.wallpaperBlur : patch.wallpaperBlur,
      showModeBadge: patch.showModeBadge == null ? state.appearance.showModeBadge : patch.showModeBadge,
      wallpaperHasImage: patch.clearWallpaperImage ? false
        : (patch.wallpaperPath ? true : state.appearance.wallpaperHasImage),
      wallpaperImageName: patch.wallpaperPath
        ? patch.wallpaperPath.split('/').pop() : state.appearance.wallpaperImageName,
      wallpaperSourceId: patch.clearWallpaperImage ? ''
        : (patch.wallpaperSourceId || state.appearance.wallpaperSourceId || ''),
      wallpaperPath: patch.clearWallpaperImage ? ''
        : (patch.wallpaperPath || state.appearance.wallpaperPath || '')
    });
    applyAppearance();
    render();
    if (msg) toast(msg);
  } catch (e) { toast('保存失败：' + e.message); }
}

    if (!(port >= 1024 && port <= 65535)) { toast('端口范围 1024-65535'); return; }
    try {
      await api('settings', { method: 'POST', body: JSON.stringify({ port }) });
      toast('已保存，重启电视端应用后生效');
    } catch (e) { toast('保存失败：' + e.message); }
  };
}

/* ============================ 公共 ============================ */
function closeModals() { modal.innerHTML = ''; }
function closeModals2() {
  // 试听用的是 <audio>，节点被删掉不代表停止播放，这里显式停一次
  try {
    const a = document.getElementById('osAudio');
    if (a) { a.pause(); a.removeAttribute('src'); }
  } catch (e) {}
  modal2.innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModals2(); closeModals(); }
});

// 系统主题变化时，AUTO 模式下本页跟着变
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if ((state.appearance || {}).themeMode === 'AUTO') applyAppearance();
});

/* 启动 */
applyAppearance();
loadState(false).then(connectWs);
setInterval(() => loadState(true), 20000);
</script>
